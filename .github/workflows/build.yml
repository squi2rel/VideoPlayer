# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Fabric
          path: |
            build/libs/VideoPlayer-*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev-shadow.jar
      - name: capture Paper artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoPlayer-Paper
          path: |
            paper-plugin/build/libs/VideoPlayer-Paper-*.jar
            !paper-plugin/build/libs/*-plain.jar
  paper-mpv-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: initialize managed MPV in Temurin Docker
        run: >-
          docker run --rm
          --volume "${GITHUB_WORKSPACE}:/workspace"
          --workdir /workspace
          --env VIDEOPLAYER_MPV_SMOKE=true
          eclipse-temurin:25-jdk-noble
          bash -lc 'apt-get update && apt-get install -y --no-install-recommends libmpv2 && chmod +x ./gradlew && ./gradlew :paper-plugin:test --tests com.github.squi2rel.vp.video.MpvNativeSmokeTest --no-daemon --rerun-tasks'
  windows-mpv-smoke:
    runs-on: windows-2025
    steps:
      - name: checkout repository
        uses: actions/checkout@v4
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: setup jdk
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: initialize managed MPV on Windows
        env:
          VIDEOPLAYER_MPV_WINDOWS_SMOKE: 'true'
        run: .\gradlew.bat :paper-plugin:test --tests com.github.squi2rel.vp.video.MpvWindowsNativeSmokeTest --no-daemon --rerun-tasks
